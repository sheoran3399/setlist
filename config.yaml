# Non-secret run settings. Secrets (API keys/tokens) live in .env instead.

# Default SoundCloud playlist to convert if none is given on the command line.
soundcloud_playlist_url: ""

# All recognized tracks are added to this single Spotify playlist.
# Created automatically on first run if it doesn't exist yet.
target_playlist_name: "SoundCloud Import"
target_playlist_public: false
target_playlist_description: "Auto-converted from SoundCloud via Shazam."

# Any track at or above this length is treated as a DJ set/mix rather than a
# single song: instead of one recognition attempt, we sample multiple spaced
# points across it and add every distinct song we identify.
dj_set_threshold_minutes: 10

# Skip this many seconds at the very start/end of a set (likely intro/outro
# talk or a fade, not a clean song to identify).
dj_set_edge_margin_seconds: 60

# How far apart (in seconds) to sample points across a DJ set. Shazam's
# unofficial API rate-limits hard under sustained volume, so unlike a paid
# per-request service we keep this sparse rather than scanning everything.
dj_set_sample_interval_seconds: 240

# Length of each clip sent to Shazam per sample.
shazam_segment_seconds: 15

# Seconds between the two clips taken at each sample point. A match is only
# accepted if both agree on the same song — catches single-clip false
# positives without needing to scan the whole mix.
shazam_confirm_offset_seconds: 7

# How many clips to recognize concurrently. Higher is faster but hits
# Shazam's (unofficial, free) API harder.
shazam_concurrency: 6
